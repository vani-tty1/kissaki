on:
  workflow_dispatch:
  push:
  		branches: [main]
  pull_request:
    branches: [unstable]
    paths-ignore:
      - "**.md"
      - ".copr"

name: Build
jobs:

  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: kissaki.flatpak
        manifest-path: build-aux/io.github.vani_tty1.kissaki.Devel.json
        cache-key: flatpak-builder-${{ github.sha }}
        arch: ${{ matrix.variant.arch }}
        verbose: true
